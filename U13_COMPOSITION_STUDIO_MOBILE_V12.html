// Déplacement d'un joueur d'un poste à un autre : permutation sans perte.
let draggingPlayer=null, draggingSlot=null;
document.querySelectorAll('.slot').forEach(slot=>{
 slot.draggable=!(('ontouchstart' in window)||navigator.maxTouchPoints>0);
 slot.addEventListener('dragstart',e=>{
   draggingSlot=slot.dataset.slot;draggingPlayer=assignments[draggingSlot]||'';
   if(!draggingPlayer){e.preventDefault();return}
   e.dataTransfer.effectAllowed='move';
   e.dataTransfer.setData('text/plain',draggingSlot);
 });
 slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('drag-over')});
 slot.addEventListener('dragleave',()=>slot.classList.remove('drag-over'));
 slot.addEventListener('drop',e=>{
   e.preventDefault();slot.classList.remove('drag-over');
   const from=e.dataTransfer.getData('text/plain'),to=slot.dataset.slot;
   if(!from||from===to||!assignments[from])return;
   [assignments[from],assignments[to]]=[assignments[to]||'',assignments[from]];
   save();render();
 });
 slot.addEventListener('dragend',()=>document.querySelectorAll('.slot').forEach(s=>s.classList.remove('drag-over')));
});
// Déplacement libre des postes du terrain : pointeur (souris ou tactile).
const pitch=document.querySelector('.field');
const positionKey=storageKey+'-positions';
let positions={};try{positions=JSON.parse(localStorage.getItem(positionKey)||'{}')}catch(e){}
function applyPositions(){
 document.querySelectorAll('.field-slot').forEach(el=>{
  const p=positions[el.dataset.slot];
  if(p){el.style.left=p.x+'%';el.style.top=p.y+'%'}
 });
}
applyPositions();
let moving=null;let moveMode=false;
function toggleMoveMode(){moveMode=!moveMode;document.querySelectorAll(".field-slot").forEach(x=>x.draggable=!moveMode);document.getElementById("move-mode").textContent=moveMode?"Terminer le déplacement des postes":"Déplacer les postes";}
pitch.querySelectorAll('.field-slot').forEach(el=>{
 el.addEventListener('pointerdown',e=>{
  if(!moveMode||e.target.closest('select'))return;
  if(e.button!==0)return;
  moving={el,startX:e.clientX,startY:e.clientY,fromX:parseFloat(el.style.left),fromY:parseFloat(el.style.top),moved:false};
  el.setPointerCapture(e.pointerId);
 });
 el.addEventListener('pointermove',e=>{
  if(!moving||moving.el!==el)return;
  const r=pitch.getBoundingClientRect();
  const dx=100*(e.clientX-moving.startX)/r.width,dy=100*(e.clientY-moving.startY)/r.height;
  if(Math.abs(dx)+Math.abs(dy)>.5)moving.moved=true;
  if(!moving.moved)return;
  el.classList.add('moving');
  const x=Math.max(7,Math.min(93,moving.fromX+dx));
  const y=Math.max(12,Math.min(90,moving.fromY+dy));
  el.style.left=x+'%';el.style.top=y+'%';
 });
 el.addEventListener('pointerup',()=>{
  if(!moving||moving.el!==el)return;
  if(moving.moved){
   positions[el.dataset.slot]={x:parseFloat(el.style.left),y:parseFloat(el.style.top)};
   try{localStorage.setItem(positionKey,JSON.stringify(positions))}catch(e){};
  }
  el.classList.remove('moving');moving=null;
 });
});
function resetPositions(){
 positions={};try{localStorage.removeItem(positionKey)}catch(e){};
 document.querySelectorAll('.field-slot').forEach(el=>{
  const p=initialPositions[el.dataset.slot];if(p){el.style.left=p.x+'%';el.style.top=p.y+'%'}
 });
}

 ['GB','DG','DD','MG','MCG','MCD','MD','AC'].forEach(k=>lines.push((titles[k]||k)+' : '+(assignments[k]||'Libre')));
 lines.push('','Remplaçants');

}

   origin={id:el.dataset.slot,x:e.clientX,y:e.clientY,pointer:e.pointerId};
  });

   if(!origin||e.pointerId!==origin.pointer)return;
   if(moveMode){origin=null;return}
   const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');
   if(target && target.dataset.slot!==origin.id && assignments[origin.id]){
     const a=origin.id,b=target.dataset.slot;
     [assignments[a],assignments[b]]=[assignments[b]||'',assignments[a]];
     save();render();
   }
   origin=null;
  });
  el.addEventListener('pointercancel',()=>origin=null);
 });
})();
